services:
  - type: web
    name: tabel-zarplata-app
    env: node
    plan: starter
    buildCommand: ""
    startCommand: "node tabel-server.js"
    healthCheckPath: "/api/health"
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: "/var/data"
    disk:
      name: tabel-data
      mountPath: "/var/data"
      sizeGB: 1
