services:
  - type: web
    name: tabel-zarplata-app
    env: node
    plan: starter
    buildCommand: ""
    startCommand: "node tabel-server.js"
    healthCheckPath: "/api/health"
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: "/var/data"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
    disk:
      name: tabel-data
      mountPath: "/var/data"
      sizeGB: 1
